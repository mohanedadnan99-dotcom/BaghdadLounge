<style>
/* 01 Tokens */
:root{
  --night-0:#05060a; --night-1:#0a0d18; --night-2:#131a2e; --river:#070b16;
  --gold-100:#fbf1d3; --gold-300:#f1dca4; --gold-500:#d4af37; --gold-700:#9c7a2b;
  --gold-grad:linear-gradient(135deg,#9c7a2b 0%,#f1dca4 45%,#d4af37 60%,#fbf1d3 100%);
  --text-1:#f5efe1; --text-2:rgba(245,239,225,.68); --text-3:rgba(245,239,225,.42);
  --glass:rgba(255,255,255,.05); --glass-border:rgba(241,220,164,.18);
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-door:cubic-bezier(.7,0,.2,1);
  --t-fast:200ms; --t-med:350ms; --t-slow:900ms;
  --f-latin:"Cinzel",serif; --f-title:"Reem Kufi",sans-serif; --f-body:"IBM Plex Sans Arabic",sans-serif;
  --s:1; --pad:24px; --ground:130px;
}

/* 02 Reset & Base */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night-0)}
body{color:var(--text-1);font-family:var(--f-body);background:var(--night-0);overflow-x:hidden;min-height:100svh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skip{position:fixed;top:-60px;right:16px;z-index:100;background:var(--gold-300);color:#111;padding:10px 16px;border-radius:4px;transition:top var(--t-fast)}
.skip:focus{top:calc(12px + env(safe-area-inset-top))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.paused *,body.paused *::before,body.paused *::after{animation-play-state:paused!important}

/* 03 Intro & Door */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;perspective:1800px;background:#000;transition:background .8s}
.gate.opening{background:transparent}
.door{position:absolute;top:0;bottom:0;width:50.2%;background:linear-gradient(180deg,#07080d,#0c0d14 50%,#07080d);
  transition:transform 1.4s var(--ease-door),opacity .5s 1.1s;backface-visibility:hidden;overflow:hidden}
.door.r{right:0;transform-origin:100% 50%}
.door.l{left:0;transform-origin:0 50%}
.door .pat{position:absolute;inset:0;width:100%;height:100%;opacity:.0;transition:opacity 1.2s .2s}
.gate.ready .door .pat{opacity:1}
.door .frame{position:absolute;inset:clamp(14px,3vw,30px);border:1px solid rgba(212,175,55,.32)}
.door .frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(212,175,55,.16)}
.door.r .frame{left:18px}.door.l .frame{right:18px}
.door::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(transparent,var(--gold-500),transparent)}
.door.r::after{left:0}.door.l::after{right:0}
.handle{position:absolute;top:78%;width:10px;height:78px;margin-top:-39px;border-radius:6px;background:var(--gold-grad);
  box-shadow:0 0 14px rgba(212,175,55,.35);transition:transform 150ms ease-in}
.handle::before{content:"";position:absolute;left:50%;top:-14px;width:16px;height:16px;margin-left:-8px;border:2px solid var(--gold-500);border-radius:50%}
.door.r .handle{left:14px}.door.l .handle{right:14px}
.seam{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--gold-100);
  box-shadow:0 0 40px 18px rgba(241,220,164,.55),0 0 120px 60px rgba(212,175,55,.25);opacity:0;transform:scaleY(.1);transition:opacity .35s,transform .5s var(--ease-out)}
.gate.opening .handle{transform:rotate(90deg)}
.gate.opening .seam{opacity:1;transform:scaleY(1)}
.gate.opening .door.r{transform:rotateY(100deg);transition-delay:.25s,1.1s;opacity:0}
.gate.opening .door.l{transform:rotateY(-100deg);transition-delay:.25s,1.1s;opacity:0}
.gate.fast{transition:opacity .45s;opacity:0}
.gate.gone{display:none}

.gate-c{position:relative;z-index:2;text-align:center;padding:24px;transition:opacity .4s,transform .6s}
.gate-c::before{content:"";position:absolute;inset:-60px -90px;z-index:-1;background:radial-gradient(closest-side,rgba(5,6,10,.97) 55%,rgba(5,6,10,0))}
.gate.opening .gate-c{opacity:0;transform:scale(.97)}
.gl{width:min(280px,60vw);height:1px;margin:0 auto 26px;background:linear-gradient(90deg,transparent,var(--gold-500),transparent);transform:scaleX(0);animation:draw 1s .3s var(--ease-out) forwards}
@keyframes draw{to{transform:scaleX(1)}}
.mono{font-family:var(--f-latin);font-weight:700;letter-spacing:.32em;padding-left:.32em;line-height:1;
  background:linear-gradient(100deg,#9c7a2b 0%,#f1dca4 30%,#fffaf0 40%,#d4af37 50%,#9c7a2b 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.gate .mono{font-size:clamp(48px,12vw,104px);opacity:0;filter:blur(12px);animation:logo 1s .8s var(--ease-out) forwards,shine 2.4s 1.2s ease-in-out forwards}
@keyframes logo{to{opacity:1;filter:blur(0)}}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.words{margin-top:14px}
.words .ar{font-family:var(--f-title);font-size:clamp(20px,4.6vw,30px)}
.words .sub{color:var(--text-2);font-size:14px;margin-top:8px}
.wd{display:inline-block;opacity:0;transform:translateY(8px);animation:wd .6s var(--ease-out) forwards}
@keyframes wd{to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;border:1px solid var(--gold-500);color:var(--gold-100);
  padding:12px 30px;font:500 15px var(--f-body);background:rgba(212,175,55,.06);border-radius:2px;transition:background var(--t-med),color var(--t-med)}
.btn:hover{background:var(--gold-500);color:#120e05}
:focus-visible{outline:2px solid var(--gold-300);outline-offset:4px}
.gate .btn{margin-top:30px;opacity:0;animation:wd .7s 2s var(--ease-out) forwards,pulse 2.8s 2.7s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 26px rgba(212,175,55,.35)}}
.gate-skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;font-size:13px;color:var(--text-2);padding:10px 16px;display:none}
.gate.seen .gate-skip{display:block}
.gate-snd{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:3;width:44px;height:44px;display:grid;place-items:center;color:var(--text-3)}

/* 04 Header */
.hdr{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) max(clamp(14px,4vw,44px),env(safe-area-inset-left)) 12px;
  background:rgba(5,6,10,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(241,220,164,.08);
  opacity:0;transform:translateY(-8px);transition:opacity 1s 1s,transform 1s 1s}
.open .hdr{opacity:1;transform:none}
.brand{display:flex;align-items:center;gap:12px}
.brand .mono{font-size:20px;letter-spacing:.24em;padding-left:.24em;background-position:0 0}
.brand span{font-size:13px;color:var(--text-2);border-right:1px solid var(--glass-border);padding-right:12px}
.tools{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.tools .chip{padding:0 10px;white-space:nowrap}
.tools strong{color:var(--text-1);font-weight:500}
.ib{min-width:44px;height:44px;display:inline-grid;place-items:center;border-radius:4px;color:var(--text-2);transition:color var(--t-fast),background var(--t-fast)}
.ib:hover{color:var(--gold-300);background:var(--glass)}
.ib[aria-pressed="true"]{color:var(--gold-300)}
.menu-btn{display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--glass-border);border-radius:3px;height:40px;color:var(--text-1)}
.menu-btn:hover{border-color:var(--gold-500)}

/* 05 Sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,var(--night-0) 0%,var(--night-1) 45%,var(--night-2) 100%)}
.sky .tint{position:absolute;inset:0;opacity:0;transition:opacity 2s;background:linear-gradient(180deg,rgba(40,24,70,.6),rgba(140,70,90,.35) 60%,rgba(230,130,70,.35))}
.tod-twilight .sky .tint{opacity:1}
.tod-day .sky{background:linear-gradient(180deg,#0b1222,#15203a 50%,#24304d)}
#stars{position:absolute;inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px)}
.moon{position:absolute;top:13vh;left:10vw;width:56px;height:56px;border-radius:50%;box-shadow:-12px 6px 0 0 #efe3c2;
  transform:rotate(-20deg);filter:drop-shadow(0 0 18px rgba(239,227,194,.35))}
.moon-wrap{position:absolute;inset:0}
.clouds{position:absolute;inset:0}
.cloud{position:absolute;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(180,170,200,.08),transparent);filter:blur(6px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.horizon{position:absolute;left:0;right:0;bottom:0;height:55vh;background:radial-gradient(70% 60% at 50% 100%,rgba(212,175,55,.16),rgba(212,120,60,.05) 50%,transparent 75%)}

/* 06 City & Buildings */
main{position:relative;z-index:1}
.scene{transform-origin:50% 50%;will-change:auto}
.scene.zoom{transition:transform var(--t-slow) cubic-bezier(.6,0,.3,1)}
.intro{text-align:center;padding:clamp(18px,4vh,40px) 16px 0;opacity:0;transition:opacity 1s 1.2s}
.open .intro{opacity:1}
.intro h1{font-family:var(--f-title);font-weight:500;font-size:clamp(1.8rem,4vw,3.4rem);line-height:1.2}
.intro h1 em{font-style:normal;font-family:var(--f-latin);font-weight:700;letter-spacing:.12em;color:var(--gold-300)}
.intro p{color:var(--text-2);font-size:14.5px;margin-top:8px}

.city{position:relative}
.row{position:relative;z-index:1;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;outline:none}
.row::-webkit-scrollbar{display:none}
.track{display:flex;align-items:flex-end;gap:clamp(6px,1.3vw,22px);width:max-content;margin-inline:auto;padding:120px var(--pad) var(--ground)}
.bldg{position:relative;display:flex;flex-direction:column;align-items:center;scroll-snap-align:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:opacity var(--t-med) var(--ease-out);min-width:44px}
.bldg:focus-visible{outline:none}
.bldg:focus-visible .lift{outline:2px solid var(--gold-300);outline-offset:4px}
.city.spot .bldg:not(.active){opacity:.55}
.stage{position:relative;clip-path:inset(-600px -600px 0 -600px)}
.rise{transform:translateY(105%);transition:transform 1.5s var(--ease-out)}
.open .rise{transform:none}
.lift{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;transition:transform var(--t-med) var(--ease-out)}
.bldg.active .lift{transform:translateY(-6px) scale(1.03)}
.sign{font-family:var(--f-title);font-weight:700;white-space:nowrap;margin-bottom:10px;font-size:calc(20px * var(--s));line-height:1.1;text-align:center;
  color:var(--c);text-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent);opacity:.82;transition:opacity var(--t-med),filter var(--t-med)}
.sign.lat{font-family:var(--f-latin);letter-spacing:.2em}
.sign small{display:block;font:500 calc(11px * var(--s)) var(--f-body);color:var(--text-3);text-shadow:none;margin-top:3px;letter-spacing:.05em}
.bldg.active .sign{opacity:1;filter:drop-shadow(0 0 8px var(--c));animation:neon .6s 1}
@keyframes neon{0%{opacity:.8}12%{opacity:.25}22%{opacity:1}34%{opacity:.45}46%,100%{opacity:1}}
.bldg svg{display:block;overflow:visible;transition:filter var(--t-med)}
.bldg.active svg{filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c) 40%,transparent))}
.edge{stroke:var(--c);stroke-opacity:.32;transition:stroke-opacity var(--t-med)}
.bldg.active .edge{stroke-opacity:.85}
.w{transition:opacity .45s var(--ease-out)}
.w.off{opacity:.07}.w.on{opacity:.8}
.bldg.soon .w.on{opacity:.4}
.bldg.active .w{opacity:1;transition-delay:calc(var(--d,0) * 20ms)}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.08}}
.dish{transform-origin:center;transform-box:fill-box;animation:spin 3s linear infinite}
.dish.track{animation:none;transition:transform .3s}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.glint{animation:glint 8s ease-in-out infinite}
@keyframes glint{0%,70%{transform:translateX(-80px)}100%{transform:translateX(230px)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--ease-out)}
.bldg.active .draw{stroke-dashoffset:0}
.warm{animation:warm 5s ease-in-out infinite alternate}
@keyframes warm{to{opacity:.85}}
.mist{transform-box:fill-box;transform-origin:center;animation:mist 5s ease-out infinite;opacity:0}
@keyframes mist{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:.5}100%{opacity:0;transform:translateY(-46px) scale(2.2)}}
.beamrot{transform-box:view-box;animation:sweep 7s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-165deg)}to{transform:rotate(-15deg)}}
.rose{transform-box:fill-box;transform-origin:center;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spark{transform-box:fill-box;opacity:0;animation:spark 7s ease-out infinite}
@keyframes spark{0%,72%{opacity:0;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

#ground{position:absolute;left:0;right:0;bottom:0;width:100%;height:calc(var(--ground) + 44px);z-index:2;pointer-events:none}

/* 09 Info Card */
.card{position:absolute;z-index:5;width:250px;padding:14px 16px;border:1px solid var(--glass-border);border-radius:6px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 18px 40px rgba(0,0,0,.45);pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out)}
.card.show{opacity:1;transform:none}
.card::before{content:"";position:absolute;top:0;right:16px;left:16px;height:1px;background:linear-gradient(90deg,transparent,var(--cc,var(--gold-300)),transparent)}
.card .k{font-size:11px;letter-spacing:.12em;color:var(--cc)}
.card b{display:block;font-family:var(--f-title);font-size:20px;margin-top:2px}
.card .tg{color:var(--text-2);font-size:13px;margin-top:2px}
.card .ft{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px}
.card .dm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;font-family:ui-monospace,Menlo,monospace;color:var(--text-3);font-size:11.5px}
.card .go{color:var(--cc);font-weight:500;white-space:nowrap}

.dots{display:none;justify-content:center;gap:4px;margin-top:6px}
.dots button{width:44px;height:28px;display:grid;place-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--text-3);transition:transform var(--t-fast),background var(--t-fast)}
.dots button.on i{background:var(--c);transform:scale(1.5)}
.hint{display:none;text-align:center;font-size:12.5px;color:var(--text-2);margin-top:4px;transition:opacity .6s}
.hint.hide{opacity:0}

.warp{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;display:grid;place-items:center;transition:opacity .3s,background .3s}
.warp b{font-family:var(--f-title);font-size:clamp(28px,6vw,54px);color:var(--text-1);opacity:0;transform:scale(.96);transition:opacity .25s,transform .4s var(--ease-out)}
.warp.dark b{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,20px);opacity:0;
  padding:12px 18px;border:1px solid var(--glass-border);background:rgba(12,13,20,.85);backdrop-filter:blur(10px);border-radius:4px;font-size:14px;
  transition:opacity var(--t-med),transform var(--t-med) var(--ease-out);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 10 Drawer */
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity var(--t-med)}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:41;width:min(380px,88vw);background:linear-gradient(180deg,#0b0d15,#07080d);
  border-left:1px solid var(--glass-border);transform:translateX(100%);transition:transform .45s var(--ease-out);display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.drawer-open .veil{opacity:1;pointer-events:auto}
.drawer-open .drawer{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer h2{font-family:var(--f-title);font-weight:500;font-size:20px}
.drawer ul{list-style:none;overflow:auto;display:flex;flex-direction:column;gap:6px}
.drawer li a{display:grid;grid-template-columns:12px 1fr;gap:4px 12px;align-items:center;padding:12px;border:1px solid transparent;border-radius:4px;min-height:44px;transition:background var(--t-fast),border-color var(--t-fast)}
.drawer li a:hover,.drawer li a:focus-visible{background:var(--glass);border-color:color-mix(in srgb,var(--c) 40%,transparent);outline:none}
.drawer .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.drawer .nm{font-family:var(--f-title);font-size:17px;display:flex;gap:8px;align-items:center}

const sky = $("#stars"), sx = sky.getContext("2d");
let DPR = Math.min(devicePixelRatio || 1, 2), stars = [], meteor = null, nextMeteor = performance.now() + rand(18000, 30000);
let plane = null, nextPlane = performance.now() + 12000;
function initSky(){
  sky.width = sky.offsetWidth * DPR; sky.height = sky.offsetHeight * DPR;
  const n = innerWidth < 700 ? 110 : 220;
  stars = Array.from({ length:n }, () => ({ x:Math.random()*sky.width, y:Math.random()*sky.height*.72, r:rand(.35,1.3)*DPR, p:Math.random()*6.28, s:rand(.004,.018) }));
}
const dishEl = $("[data-dish]");
function drawSky(now){
  const W = sky.width, H = sky.height;
  sx.clearRect(0, 0, W, H);
  const dim = TOD === "night" ? 1 : TOD === "twilight" ? .55 : .35;
  sx.fillStyle = "#f3ecdf";
  for (const s of stars) { s.p += s.s; sx.globalAlpha = (.3 + .45 * Math.sin(s.p)) * dim; sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 6.283); sx.fill(); }
  sx.globalAlpha = 1;
  if (reduced) return;
  // شهاب
  if (!meteor && now > nextMeteor) meteor = { x:rand(.3,1)*W, y:rand(.02,.3)*H, t:0, len:rand(120,200)*DPR };
  if (meteor) {
    meteor.t += .018;
    const k = meteor.t, mx = meteor.x - k*420*DPR, my = meteor.y + k*190*DPR;
    const g = sx.createLinearGradient(mx, my, mx + meteor.len*.9, my - meteor.len*.4);
    g.addColorStop(0, `rgba(255,248,225,${.9*(1-k)})`); g.addColorStop(1, "rgba(255,248,225,0)");
    sx.strokeStyle = g; sx.lineWidth = 1.4*DPR; sx.beginPath(); sx.moveTo(mx, my); sx.lineTo(mx + meteor.len*.9, my - meteor.len*.4); sx.stroke();
    if (k >= 1) { meteor = null; nextMeteor = now + rand(18000, 30000); }
  }
  // طيارة تعبر من اليمين لليسار
  if (!plane && now > nextPlane) plane = { x:W + 30*DPR, y:rand(.14,.24)*H, v:W/(22*60) };
  if (plane) {
    plane.x -= plane.v;
    const px = plane.x, py = plane.y, b = Math.floor(now/600) % 2;
    sx.fillStyle = "rgba(200,205,220,.55)"; sx.fillRect(px - 9*DPR, py - 1*DPR, 18*DPR, 2*DPR); sx.fillRect(px - 2*DPR, py - 5*DPR, 4*DPR, 10*DPR);
    const dot = (x, y, c, a) => { sx.globalAlpha = a; sx.fillStyle = c; sx.beginPath(); sx.arc(x, y, 1.8*DPR, 0, 6.283); sx.fill(); sx.globalAlpha = a*.25; sx.beginPath(); sx.arc(x, y, 6*DPR, 0, 6.283); sx.fill(); };
    dot(px, py - 5*DPR, "#ff4040", b ? 1 : .2); dot(px, py + 5*DPR, "#40ff7a", b ? 1 : .2); dot(px + 9*DPR, py, "#ffffff", (Math.floor(now/900)%3===0) ? 1 : .1);
    sx.globalAlpha = 1;
    // صحن الرادار يلاحق الطيارة
    if (dishEl) {
      const r = dishEl.getBoundingClientRect(), dx = px/DPR - 16 - (r.left + r.width/2);
      if (Math.abs(dx) < 260) { dishEl.classList.add("track"); dishEl.style.transform = `scaleX(${clamp(dx/130, -1, 1).toFixed(2)})`; }
      else if (dishEl.classList.contains("track")) { dishEl.classList.remove("track"); dishEl.style.transform = ""; }
    }
    if (plane.x < -40*DPR) { plane = null; nextPlane = now + rand(55000, 70000); }
  }
}

// 07 Street & River animation
const gc = $("#ground"), gx = gc.getContext("2d");
let cars = [], boat = null, nextBoat = performance.now() + 20000, GW = 0, GH = 0;
function initGround(){ gc.width = gc.offsetWidth * DPR; gc.height = gc.offsetHeight * DPR; GW = gc.width; GH = gc.height; }
function spawnCar(dir){
  const vip = Math.random() < .12;
  return { dir, vip, x: dir > 0 ? -40*DPR : GW + 40*DPR, v: rand(.9, 1.9) * DPR * (reduced ? .4 : 1) * (vip ? .8 : 1) };
}
function drawGround(now){
  const S = 44*DPR, R = S + 26*DPR, W = GW, H = GH;
  gx.clearRect(0, 0, W, H);
  // الشارع
  let g = gx.createLinearGradient(0, S, 0, R); g.addColorStop(0, "#16171d"); g.addColorStop(1, "#0d0e12");
  gx.fillStyle = g; gx.fillRect(0, S, W, R - S);
  gx.fillStyle = "rgba(212,175,55,.38)"; gx.fillRect(0, S, W, 1*DPR);
  gx.fillStyle = "rgba(241,220,164,.2)"; for (let x = 0; x < W; x += 40*DPR) gx.fillRect(x, S + 12*DPR, 18*DPR, 1*DPR);
  // أعمدة الإنارة
  for (let x = 60*DPR; x < W; x += 150*DPR) {
    gx.fillStyle = "rgba(120,110,90,.6)"; gx.fillRect(x, S - 30*DPR, 1.5*DPR, 30*DPR); gx.fillRect(x - 6*DPR, S - 30*DPR, 7.5*DPR, 1.5*DPR);
    const lg = gx.createRadialGradient(x - 5*DPR, S - 28*DPR, 0, x - 5*DPR, S - 28*DPR, 14*DPR); lg.addColorStop(0, "rgba(255,214,150,.9)"); lg.addColorStop(1, "rgba(255,214,150,0)");
    gx.fillStyle = lg; gx.fillRect(x - 20*DPR, S - 42*DPR, 30*DPR, 28*DPR);
    const fl = gx.createRadialGradient(x - 5*DPR, S + 6*DPR, 0, x - 5*DPR, S + 6*DPR, 26*DPR); fl.addColorStop(0, "rgba(255,214,150,.16)"); fl.addColorStop(1, "rgba(255,214,150,0)");
    gx.fillStyle = fl; gx.fillRect(x - 32*DPR, S, 54*DPR, 26*DPR);
  }
  // السيارات
  if (cars.length < (W/DPR > 900 ? 9 : 5) && Math.random() < .02) cars.push(spawnCar(Math.random() < .5 ? 1 : -1));
  cars = cars.filter(c => c.x > -60*DPR && c.x < W + 60*DPR);
  for (const c of cars) {
    c.x += c.v * c.dir;
    const y = c.dir > 0 ? S + 6*DPR : S + 18*DPR;
    if (c.vip) {
      gx.fillStyle = "#050505"; gx.fillRect(c.x - 12*DPR, y - 2*DPR, 24*DPR, 5*DPR);
      gx.fillStyle = "rgba(212,175,55,.95)"; gx.fillRect(c.x - 12*DPR, y - 2.5*DPR, 24*DPR, .8*DPR);
    }
    const head = c.dir > 0, hx = c.x + (head ? 12 : -12)*DPR;
    const col = c.vip ? "255,226,150" : head ? "255,244,210" : "255,60,60";
    const hg = gx.createRadialGradient(hx, y, 0, hx, y, 9*DPR); hg.addColorStop(0, `rgba(${col},.95)`); hg.addColorStop(1, `rgba(${col},0)`);
    gx.fillStyle = hg; gx.fillRect(hx - 9*DPR, y - 9*DPR, 18*DPR, 18*DPR);
  }
  // دجلة
  g = gx.createLinearGradient(0, R, 0, H); g.addColorStop(0, "#0a1220"); g.addColorStop(1, "#050810");
  gx.fillStyle = g; gx.fillRect(0, R, W, H - R);
  const t = now / 1000, wr = gc.getBoundingClientRect();
  // انعكاس البنايات
  els.forEach((e, i) => {
    const r = e.querySelector(".lift").getBoundingClientRect();
    if (r.right < wr.left || r.left > wr.right) return;
    const cx = (r.left + r.width/2 - wr.left) * DPR, w = r.width * .55 * DPR;
    const act = e.classList.contains("active"), dimmed = cur >= 0 && !act;
    const base = act ? .42 : dimmed ? .08 : list[i].status === "live" ? .2 : .13;
    gx.fillStyle = list[i].color;
    for (let y = 0; y < H - R; y += 3*DPR) {
      const f = y / (H - R), off = reduced ? 0 : Math.sin(t*2 + y*.09/DPR + i) * 4*DPR * (0.3 + f);
      gx.globalAlpha = base * (1 - f) * (.55 + .45*Math.sin(y*.5/DPR + t*3));
      const ww = w * (1 - f*.4);
      gx.fillRect(cx - ww/2 + off, R + y, ww, 1.6*DPR);
    }
  });
  // انعكاس الهلال
  const mr = $("#moon").getBoundingClientRect(), mx = (mr.left + mr.width/2 - wr.left) * DPR;
  gx.fillStyle = "#efe3c2";
  for (let y = 4*DPR; y < (H - R)*.7; y += 5*DPR) { gx.globalAlpha = .18 * (1 - y/(H-R)); const off = reduced ? 0 : Math.sin(t*1.6 + y*.12/DPR)*5*DPR; gx.fillRect(mx - 10*DPR + off, R + y, 20*DPR*(1 - y/(H-R)), 1.4*DPR); }
  gx.globalAlpha = 1;
  // موج
  gx.strokeStyle = "rgba(212,175,55,.07)"; gx.lineWidth = 1*DPR;
  for (let k = 0; k < 6; k++) {
    const y = R + (14 + k*15)*DPR; gx.beginPath();
    for (let x = 0; x <= W; x += 24*DPR) gx.lineTo(x, y + Math.sin(x*.012/DPR + t*(reduced ? 0 : .8 + k*.2) + k) * 2*DPR);
    gx.stroke();
  }
  // قارب بفانوس
  if (!reduced) {
    if (!boat && now > nextBoat) boat = { x:-40*DPR, y:R + rand(40, 70)*DPR };
    if (boat) {
      boat.x += .35*DPR; const by = boat.y + Math.sin(t*1.5)*1.5*DPR;
      gx.fillStyle = "#020306"; gx.beginPath(); gx.moveTo(boat.x - 16*DPR, by); gx.lineTo(boat.x + 16*DPR, by); gx.lineTo(boat.x + 11*DPR, by + 5*DPR); gx.lineTo(boat.x - 11*DPR, by + 5*DPR); gx.fill();
      gx.fillRect(boat.x - .7*DPR, by - 12*DPR, 1.4*DPR, 12*DPR);
      const lg = gx.createRadialGradient(boat.x, by - 13*DPR, 0, boat.x, by - 13*DPR, 12*DPR); lg.addColorStop(0, "rgba(255,200,120,.9)"); lg.addColorStop(1, "rgba(255,200,120,0)");
      gx.fillStyle = lg; gx.fillRect(boat.x - 12*DPR, by - 25*DPR, 24*DPR, 24*DPR);
      gx.globalAlpha = .25; gx.fillStyle = "#ffc878"; for (let y = 6; y < 30; y += 4) gx.fillRect(boat.x - 3*DPR + Math.sin(t*3 + y)*2*DPR, by + y*DPR, 6*DPR, 1*DPR); gx.globalAlpha = 1;
      if (boat.x > W + 40*DPR) { boat = null; nextBoat = now + rand(40000, 60000); }
    }
  }
}

// Parallax (الماوس أو ميلان الموبايل)
let tx = 0, ty = 0, px = 0, py = 0;
if (!reduced) {
  addEventListener("mousemove", e => { tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; }, { passive:true });
  addEventListener("deviceorientation", e => { if (e.gamma == null) return; tx = clamp(e.gamma / 30, -1, 1); ty = clamp((e.beta - 45) / 30, -1, 1); }, { passive:true });
}
const L = { stars: sky, moon: $("#moonL"), clouds: $("#cloudL") };
function parallax(){
  px += (tx - px) * .05; py += (ty - py) * .05;
  L.stars.style.transform  = `translate3d(${-px*3}px,${-py*2}px,0)`;
  L.moon.style.transform   = `translate3d(${-px*6}px,${-py*4}px,0)`;
  L.clouds.style.transform = `translate3d(${-px*9}px,${-py*5}px,0)`;
}

// 08 Drawer
const drawer = $("#drawer"), dList = $("#dList");
let drawerOpen = false;
[...list].sort((a,b) => (b.isParent?1:0) - (a.isParent?1:0)).forEach(co => {
  const i = list.indexOf(co), live = co.status === "live";
  const li = document.createElement("li");
  li.innerHTML = `<a href="${live ? co.url : "#" + co.id}" style="--c:${co.color}"><span class="dot"></span><span class="nm">${co.name}${live ? "" : "<em>قريباً</em>"}</span><span class="tg">${co.tagline}</span><span class="dm">${domain(co.url)}</span></a>`;
  const a = li.firstChild;
  const spot = () => setActive(i, { scroll: mobileMQ.matches, sound:false });
  a.addEventListener("mouseenter", spot); a.addEventListener("focus", spot);
  a.addEventListener("click", e => { if (e.ctrlKey || e.metaKey || e.shiftKey) { if (!live) e.preventDefault(); return; } e.preventDefault(); closeDrawer(true); setActive(i, { sound:false }); go(i); });
  dList.appendChild(li);
});
function openDrawer(){
  drawerOpen = true; document.body.classList.add("drawer-open");
  drawer.setAttribute("aria-hidden", "false"); $("#menuBtn").setAttribute("aria-expanded", "true");
  setTimeout(() => $("a", dList).focus(), 50);
}
function closeDrawer(keep){
  drawerOpen = false; document.body.classList.remove("drawer-open");
  drawer.setAttribute("aria-hidden", "true"); $("#menuBtn").setAttribute("aria-expanded", "false");
  if (!keep) { $("#menuBtn").focus(); if (!mobileMQ.matches) setActive(-1); }
}
$("#menuBtn").addEventListener("click", openDrawer);
$("#closeDrawer").addEventListener("click", () => closeDrawer());
$("#veil").addEventListener("click", () => closeDrawer());
drawer.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const f = $$("a,button", drawer), first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// 09 Sound (Web Audio) — مطفي افتراضياً
const Sound = {
  on:false, ctx:null, master:null, amb:null, lastTing:0,
  icon(){ return this.on
    ? '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'; },
  render(){ $$(".snd").forEach(b => { b.innerHTML = this.icon(); b.setAttribute("aria-pressed", String(this.on)); b.setAttribute("aria-label", this.on ? "إيقاف الصوت" : "تشغيل الصوت"); }); },
  init(){
    if (this.ctx) return true;
    try {
      const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf; return true;
    } catch(e) { return false; }
  },
  toggle(){
    if (!this.init()) { toast("الصوت غير مدعوم بهذا المتصفح"); return; }
    this.on = !this.on;
    const c = this.ctx; c.resume && c.resume().catch(() => {});
    if (this.on) { this.startAmb(); this.master.gain.setTargetAtTime(1, c.currentTime, .4); }
    else this.master.gain.setTargetAtTime(0, c.currentTime, .3);
    this.render();
  },
  startAmb(){
    if (this.amb) return; const c = this.ctx, out = c.createGain(); out.gain.value = .05; out.connect(this.master);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.connect(out);
    [55, 82.4, 110.2].forEach((f, k) => { const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f; o.detune.value = k*4; const g = c.createGain(); g.gain.value = k === 2 ? .25 : .6; o.connect(g).connect(lp); o.start(); });
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .07; lg.gain.value = .025; lfo.connect(lg).connect(out.gain); lfo.start();
    const n = c.createBufferSource(); n.buffer = this.noise; n.loop = true; const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 600; bp.Q.value = .4;
    const ng = c.createGain(); ng.gain.value = .25; n.connect(bp).connect(ng).connect(out); n.start();
    this.amb = out;
  },
  tone(f, dur, vol, delay = 0, type = "sine"){
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  ting(){ if (!this.on) return; const n = performance.now(); if (n - this.lastTing < 120) return; this.lastTing = n; this.tone(1568, .5, .035); this.tone(2349, .35, .018, .01); },
  door(){
    if (!this.on) return; const c = this.ctx, t = c.currentTime;
    this.tone(70, .9, .2, 0, "sine");
    const n = c.createBufferSource(); n.buffer = this.noise; const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(1400, t + 1.2);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .3); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
    n.connect(f).connect(g).connect(this.master); n.start(t); n.stop(t + 1.7);
    [784, 1175, 1568].forEach((fr, k) => this.tone(fr, 1.6, .05, .7 + k*.09));
  },
  whoosh(){
    if (!this.on) return; const c = this.ctx, t = c.currentTime, n = c.createBufferSource(); n.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2500, t + .8);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .5); g.gain.exponentialRampToValueAtTime(.0001, t + .95);
    n.connect(f).connect(g).connect(this.master); n.start(t); n.stop(t + 1);
  }
};
Sound.render();
$$(".snd").forEach(b => b.addEventListener("click", () => Sound.toggle()));

// 10 Init
let paused = false, rafId = 0;
function frame(now){
  if (paused) return;
  drawSky(now); drawGround(now); if (!reduced) parallax();
  rafId = requestAnimationFrame(frame);
}
// وميض الشبابيك بشكل طبيعي
setInterval(() => {
  if (paused) return;
  const e = els[Math.floor(Math.random() * els.length)], ws = $$(".w", e), w = ws[Math.floor(Math.random() * ws.length)];
  if (w && !e.classList.contains("active")) { w.classList.toggle("on"); w.classList.toggle("off"); }
}, 800);
document.addEventListener("visibilitychange", () => {
  paused = document.hidden;
  document.body.classList.toggle("paused", paused);
  if (Sound.ctx) { paused ? Sound.ctx.suspend().catch(()=>{}) : (Sound.on && Sound.ctx.resume().catch(()=>{})); }
  if (!paused) { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame); }
});
function onResize(){ DPR = Math.min(devicePixelRatio || 1, 2); scale(); initSky(); initGround(); positionCard(); }
addEventListener("resize", onResize);
initSky(); initGround();
rafId = requestAnimationFrame(frame);
</script>
